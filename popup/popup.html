<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
/* 设计令牌与设置页同源(两处一致维护,改动需同步 options.html) */
:root {
  color-scheme: light dark;
  --bg: #fff; --surface: #f9fafb; --border: #eaecf0; --border-2: #d0d5dd;
  --text: #101828; --text-2: #475467; --text-3: #98a2b3;
  --brand: #175cd3; --brand-hover: #1249ac; --brand-text: #175cd3;
  --on-brand: #fff;
  --danger-bg: #fef3f2; --danger-border: #fecdca; --danger-text: #7a2b0e;
  --warn-bg: #fffaeb; --warn-border: #fec84b; --warn-text: #93370d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181d; --surface: #1c1f25; --border: #262a31; --border-2: #344054;
    --text: #f0f1f3; --text-2: #a8adb8; --text-3: #6f7683;
    --brand: #2f6fe0; --brand-hover: #4a83e7; --brand-text: #7fb1f7;
    --on-brand: #fff;
    --danger-bg: #2b1618; --danger-border: #5b2124; --danger-text: #f97066;
    --warn-bg: #2b2311; --warn-border: #4b3b13; --warn-text: #fdb022;
  }
}
* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  width: 320px; margin: 0; padding: 16px;
  background: var(--bg); color: var(--text);
}
header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
header img { width: 22px; height: 22px; }
header h1 { font-size: 15px; margin: 0; flex: 1; }
header a { color: var(--brand-text); font-size: 13px; text-decoration: none; }
header a:hover { text-decoration: underline; }

.status { font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
.status b { color: var(--brand-text); }

.warn {
  border-radius: 8px; padding: 10px; font-size: 13px;
  margin-bottom: 12px; line-height: 1.6;
}
.warn + .warn { margin-top: -4px; }
#warn-mic { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger-text); }
#warn-key { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); }

button.bigbtn {
  display: block; width: 100%; box-sizing: border-box;
  background: var(--brand); color: var(--on-brand); border: none; border-radius: 10px;
  padding: 11px; font-size: 14px; cursor: pointer; margin-bottom: 8px;
  transition: background 120ms;
}
button.bigbtn:hover { background: var(--brand-hover); }
button.bigbtn:disabled { opacity: .5; cursor: default; }
button.bigbtn kbd { margin-left: 4px; }

h2 {
  font-size: 12px; color: var(--text-3); margin: 14px 0 6px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
}
.hist { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow: auto; }
.hist li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.hist .t { color: var(--text); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.hist .m { color: var(--text-3); font-size: 11px; margin-top: 2px; }
.empty { color: var(--text-3); font-size: 13px; padding: 8px 0; }

footer { display: flex; justify-content: space-between; margin-top: 14px; }
footer span { color: var(--text-3); font-size: 12px; }
footer a { color: var(--brand-text); font-size: 12px; text-decoration: none; }
footer a:hover { text-decoration: underline; }

kbd {
  background: var(--surface); border: 1px solid var(--border-2);
  border-radius: 4px; padding: 1px 5px; font-size: 11px;
  color: var(--text-2); font-family: ui-monospace, Menlo, monospace;
}
</style>
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" alt="">
    <h1>CrostiVoice</h1>
    <a href="#" id="open-options">设置</a>
  </header>

  <div class="warn" id="warn-mic" hidden>
    首次使用需授权麦克风一次。
    <button class="bigbtn" id="grant-mic">启用麦克风</button>
  </div>

  <div class="warn" id="warn-key" hidden>
    <span id="warn-key-text"></span>
    <button class="bigbtn" id="open-shortcuts2">去绑定快捷键</button>
  </div>

  <div class="status" id="status">加载中…</div>
  <button class="bigbtn" id="btn-dictate">🎙 语音输入 <kbd>点一下 Search+A</kbd></button>

  <h2>最近记录</h2>
  <ul class="hist" id="hist"></ul>

  <footer>
    <span>快捷键可在 <a href="#" id="open-shortcuts">chrome://extensions/shortcuts</a> 修改</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
